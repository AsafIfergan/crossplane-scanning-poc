# Standalone RDS instance — storageEncrypted is false (violation)
apiVersion: database.aws.crossplane.io/v1beta1
kind: RDSInstance
metadata:
  name: my-rds-unencrypted
spec:
  forProvider:
    allocatedStorage: 50
    dbInstanceClass: db.t3.medium
    engine: mysql
    region: us-west-2
    engineVersion: "5.7.33"
    publiclyAccessible: false
    storageEncrypted: false
    storageType: gp2
  providerConfigRef:
    name: example
