# Composition with composed Upbound SG + ingress rule — cidrIpv4 restricted (pass).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: upbound-app-network
spec:
  compositeTypeRef:
    apiVersion: network.example.org/v1alpha1
    kind: CompositeAppNetwork
  resources:
    - name: app-sg
      base:
        apiVersion: ec2.aws.upbound.io/v1beta1
        kind: SecurityGroup
        metadata:
          name: composed-upbound-app-sg
        spec:
          forProvider:
            region: us-east-1
            name: composed-upbound-app-sg
            description: App tier — only intra-VPC traffic
    - name: app-ingress
      base:
        apiVersion: ec2.aws.upbound.io/v1beta1
        kind: SecurityGroupIngressRule
        metadata:
          name: composed-upbound-app-ingress
        spec:
          forProvider:
            region: us-east-1
            description: Allow HTTPS from VPC CIDR
            cidrIpv4: 10.0.0.0/16
            fromPort: 443
            toPort: 443
            ipProtocol: tcp
            securityGroupIdRef:
              name: composed-upbound-app-sg
